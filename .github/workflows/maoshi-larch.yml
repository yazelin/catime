name: 卯時上架

# 到期就上架：台北 05:00（卯時）以後，有已經結束、市集還沒公告的一期，就重新上架並附上那一期的更新說明（不通知追蹤者）。
# hourly-cat 每次產完貓也會呼叫同一支腳本；這裡每天 05:00 再排一次當備援，誰先跑到就由誰上，不會重複。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 到期就真的上架（不勾只檢查）
        type: boolean
        default: false
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00＝台北 05:00

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: 到期就上架
        env:
          LARCH_AGENT_KEY: ${{ secrets.LARCH_AGENT_KEY }}
          PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
        run: |
          if [ "$PUBLISH" = "true" ]; then python scripts/maoshi_larch.py --publish; else python scripts/maoshi_larch.py; fi

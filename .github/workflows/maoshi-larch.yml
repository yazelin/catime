name: 卯時上架

# 把 Larch《卯時》的市集版本更新一次，附上昨天那一期的更新說明（不通知追蹤者）。
# 每天台北 05:00（卯時）自動跑；手動跑時預設只檢查，勾 publish 才上架。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 真的上架（不勾只檢查金鑰與更新說明）
        type: boolean
        default: false
      day:
        description: 哪一期，例 26.11.04；留空＝台北時間的昨天
        default: ''
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00＝台北 05:00

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: 更新市集版本
        env:
          LARCH_AGENT_KEY: ${{ secrets.LARCH_AGENT_KEY }}
          PUBLISH: ${{ inputs.publish || github.event_name == 'schedule' }}
          DAY: ${{ inputs.day }}
        run: |
          args=()
          [ "$PUBLISH" = "true" ] && args+=(--publish)
          [ -n "$DAY" ] && args+=(--day "$DAY")
          python scripts/maoshi_larch.py "${args[@]}"

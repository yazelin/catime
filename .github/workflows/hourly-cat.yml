name: Hourly Cat Generator

on:
  schedule:
    - cron: '17 * * * *'  # Every hour at :17; :00 is GitHub's busiest slot and runs get dropped
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

concurrency:
  group: hourly-cat
  cancel-in-progress: true

jobs:
  generate-cat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install nanobanana-py google-genai Pillow

      - name: Validate codex backend secrets (fail fast)
        if: vars.CAT_IMAGE_GENERATOR == 'codex'
        env:
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          CODEX_IMAGE_BASE_URL: ${{ secrets.CODEX_IMAGE_BASE_URL }}
        run: |
          missing=0
          if [ -z "$CODEX_IMAGE_KEY" ]; then
            echo "::error::CAT_IMAGE_GENERATOR=codex but CODEX_IMAGE_KEY secret is empty."
            missing=1
          elif [[ ! "$CODEX_IMAGE_KEY" =~ ^cimg_ ]]; then
            echo "::error::CODEX_IMAGE_KEY does not start with 'cimg_' — looks like a key_* handle was pasted instead of the bearer token. Re-create the key in codex-image-service admin and copy the cimg_<random> value from the yellow popup."
            missing=1
          fi
          if [ -z "$CODEX_IMAGE_BASE_URL" ]; then
            echo "::error::CAT_IMAGE_GENERATOR=codex but CODEX_IMAGE_BASE_URL secret is empty."
            missing=1
          elif [[ ! "$CODEX_IMAGE_BASE_URL" =~ ^https?:// ]]; then
            echo "::error::CODEX_IMAGE_BASE_URL must start with http:// or https:// (got '${CODEX_IMAGE_BASE_URL}')."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Generate cat and update repo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_WEB_BASE_URL: ${{ secrets.GEMINI_WEB_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NANOBANANA_MODEL: gemini-3-pro-image-preview
          NANOBANANA_TIMEOUT: '240'
          NANOBANANA_FALLBACK_MODELS: gemini-3.1-flash-image-preview,gemini-2.5-flash-image
          # codex-image-service path. Set repo variable CAT_IMAGE_GENERATOR=codex to
          # route the final image through the self-hosted Codex backend instead of
          # nanobanana (Gemini). Idea / prompt-engineering Gemini calls stay as-is.
          CAT_IMAGE_GENERATOR: ${{ vars.CAT_IMAGE_GENERATOR }}
          CODEX_IMAGE_KEY: ${{ secrets.CODEX_IMAGE_KEY }}
          CODEX_IMAGE_BASE_URL: ${{ secrets.CODEX_IMAGE_BASE_URL }}
        run: python scripts/generate_cat.py

      - name: Update 卯時 data
        if: success()
        continue-on-error: true  # 卯時壞掉不影響貓
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 縮圖補齊在跑的時候整步跳過，免得兩邊同時推資料；補齊跑完會重寫資料，下一小時也會補上
          if [ -n "$(gh run list -w maoshi-backfill.yml --limit 3 --json status -q '.[]|select(.status!="completed")|.status')" ]; then
            echo "卯時縮圖補齊進行中，這小時先跳過"; exit 0
          fi
          git pull --rebase -q || true
          python scripts/maoshi_build.py thumbs --limit 30
          python scripts/maoshi_build.py data
          python scripts/maoshi_build.py push

      - name: 卯時上架（到期才上）
        if: success()
        continue-on-error: true  # 上架失敗不影響貓，下一小時或 05:00 的排程會再試
        env:
          LARCH_AGENT_KEY: ${{ secrets.LARCH_AGENT_KEY }}
        run: python scripts/maoshi_larch.py --publish

      - name: Post to Telegram channel
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: '@catime_yaze'
        run: python scripts/post_telegram.py

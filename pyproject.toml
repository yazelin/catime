[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catime"
version = "0.4.10"
description = "AI-generated hourly cat images - a new cat every hour!"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.4,<1",
]

[project.scripts]
catime = "catime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catime"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "catime/docs"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# ponytail: 釘住規則集,新版 ruff 加預設規則不會讓 CI 無預警變紅
select = ["E4", "E7", "E9", "F", "PLW1510"]
# BLE001 沒開:scripts/ 那層的 except Exception 是刻意的降級,每個都有印出例外,
# 開了只會換來十筆 noqa。真正會靜靜壞掉的那幾處已經個別修掉。

[tool.pytest.ini_options]
testpaths = ["tests"]

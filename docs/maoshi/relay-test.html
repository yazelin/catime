<!doctype html><meta charset="utf-8"><title>卯時儲存測試</title>
<style>body{font:18px/1.6 sans-serif;padding:24px;background:#fffdfb;color:#141114}</style>
<div id="o">讀取中…</div><button id="b" type="button">存一筆</button>
<script src="store.js"></script>
<script>
// 暫時的驗證頁：確認兩種儲存都存得進去、讀得回來；《卯時》正式頁完成後刪掉
MaoStore.ready.then(function (s) {
  var o = document.getElementById('o');
  function show() { o.textContent = 'MODE=' + s.mode + ' SAVED=' + s.get('mao_saved'); }
  show(); s.onchange = show;
  document.getElementById('b').onclick = function () {
    var v = s.get('mao_saved'); s.set('mao_saved', (v ? v + ',' : '') + (Date.now() % 10000)); show();
  };
});
</script>
